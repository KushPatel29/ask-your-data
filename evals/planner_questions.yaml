  sql: >
    SELECT r.department, COUNT(*) AS n
    FROM hr_fact_employees e
    JOIN hr_flight_risk_scores r ON e.employee_id = r.employee_id
    GROUP BY 1 ORDER BY n DESC LIMIT 3
  expect: Human Resources
  expect_rows: 3

# ---------------------------------------------------------------------------
# Kept deliberately: questions the planner CANNOT compile. Each must end in a
# refusal rather than a plausible number. A planner that starts answering these
# has regressed, and the test asserts the refusal as firmly as any answer.
#
# Both are honest misses rather than inherent limits, and the fix for both is a
# better column description in data_manifest.py -- not a special case in the
# grammar. They are written down here so the gap is measured instead of
# remembered.
# ---------------------------------------------------------------------------

- id: involuntary_terminations
  domain: hr
  question: How many involuntary terminations were there?
  sql: ""
  expect: null
  expect_refusal: true
  why: >
    term_type = 'Involuntary' is right there and would answer it. But
    "terminations" binds to nothing -- the column is term_type, and no
    description in the manifest spells the word out -- so the excused-word cap
    fires and the planner stops. It is one word of vocabulary away from
    correct, which is exactly the kind of miss worth keeping visible.

- id: subjects_per_site
  domain: clinical
  question: How many subjects per site?
  sql: ""
  expect: null
  expect_refusal: true
  why: >
    subject_id and site_id are both columns of clinical_edc_item_data, so this
    is COUNT(DISTINCT subject_id) GROUP BY site_id -- a distinct count over a
    non-unique key, which the grammar deliberately does not express. Counting
    rows instead would answer with the number of data points, not people.

# ---------------------------------------------------------------------------
# Round two. Every question below was found by STRESS-TESTING the planner
# against phrasings this file did not contain, and on the first run eight of the
# sixteen it answered were WRONG -- a 50% error rate on unseen wording, against
# a contract that was reporting 100%. That gap is the reason these are here: an
# eval set only measures the questions somebody thought to write down, and the
# first version of this one was written by the same person who wrote the binder.
#
# Each of these had a specific, named failure. They are kept so it stays fixed.
# ---------------------------------------------------------------------------

- id: denied_claims_for_medicare
  domain: healthcare
  question: How many denied claims for Medicare?
  sql: >
    SELECT COUNT(*) FROM healthcare_fact_claims c
    JOIN healthcare_dim_payer p ON c.payer_id = p.payer_id
    WHERE c.status = 'Denied' AND p.payer_type = 'Medicare'
  expect: 152
  expect_rows: 1
  why: >
    `Medicare` is a payer_type value in TWO tables: healthcare_dim_payer (8
    rows) and healthcare_ar_yield_predictions (1,378 rows, and only the open-AR
    subset, which contains no denied claims at all). Taking whichever binding
    came first joined to the second and answered 0. Value bindings now prefer
    the smallest table, which is the derived stand-in for "the attribute's
    canonical home".

- id: count_stores
  domain: wholesale
  question: How many stores do we have?
  sql: SELECT COUNT(*) FROM wholesale_dim_store
  expect: 620
  expect_rows: 1
  why: >
    Answered 170 -- the number of store-MONTHS in a fact table with a store
    flag -- and then 555, after the right table was found but the entity noun
    `stores` switched on `is_physical_store`. A counted entity now steers the
    table by GRAIN and is forbidden from setting a boolean.

- id: count_payers
  domain: healthcare
  question: How many payers are there?
  sql: SELECT COUNT(*) FROM healthcare_dim_payer
  expect: 8
  expect_rows: 1
  why: >
    Refused, because anchoring compared question words to table words RAW and
    `payers` is not `payer`. The very same word had already been credited as
    explained by the expanded comparison two lines above.

- id: distinct_customers
  domain: retail
  question: How many distinct customers are there?
  sql: SELECT COUNT(DISTINCT customer_id) FROM retail_dim_customer
  expect: 120
  expect_rows: 1
  why: >
    Answered 4, from COUNT(DISTINCT new_customers) on a marketing campaign
    table -- a column that happens to be unique. Three separate bugs: the
    entity noun was being read as `distinct` rather than `customers`, the
    COUNT DISTINCT target fell back to whatever key came first, and
    `distinct_skus` scored as a measure on the word naming the aggregate.

- id: bottom_departments_by_salary
  domain: hr
  question: Bottom 3 departments by average salary
  sql: >
    SELECT r.department, AVG(e.base_salary) AS s
    FROM hr_fact_employees e
    JOIN hr_flight_risk_scores r ON e.employee_id = r.employee_id
    GROUP BY 1 ORDER BY s ASC LIMIT 3
  expect: Customer Support
  expect_rows: 3
  why: >
    Answered with `AVG(departments_supplied)` on a supplier table: the measure
    matched the AXIS word `departments` and scored 0.5, which was enough. When
    a question names the measure ("by average salary"), the measure must now
    contain one of THOSE words.

- id: transactions_per_hour
  domain: aml
  question: How many transactions per hour of day?
  sql: SELECT hour_of_day, COUNT(*) FROM aml_fact_transactions GROUP BY 1 ORDER BY 1
  expect: 0
  expect_rows: 24
  why: >
    Returned one number, the grand total, because `hour_of_day` -- 24 values
    over 100,299 rows -- was classified a MEASURE by a numeric-categorical cap
    of 12. The cap is 24 now, with a stricter rows-per-value ratio.

- id: claims_by_channel_count
  domain: aml
  question: break down transactions by channel
  sql: SELECT channel, COUNT(*) FROM aml_fact_transactions GROUP BY 1 ORDER BY 1
  expect: bill_payment
  expect_rows: 6
  why: >
    Summed `txn_count_7d`, a rolling-window feature column, because the synonym
    map maps "transactions" to "txn". An entity noun is what you are counting,
    never what you are summing.

- id: claims_submitted_in_year
  domain: healthcare
  question: How many claims were submitted in 2024?
  sql: >
    SELECT COUNT(*) FROM healthcare_fact_claims
    WHERE EXTRACT(YEAR FROM submitted_date) = 2024
  expect: 0
  expect_rows: 1
  why: >
    Crashed with `Conversion Error: Unimplemented type for cast (INTEGER ->
    DATE)` -- a year was being emitted as `service_date = 2024`. It is a
    predicate ON a date. It also picked service_date over submitted_date when
    the question said "submitted". Zero is the correct answer: this snapshot
    runs 2025-07-01 to 2026-06-30.

- id: claims_above_threshold
  domain: healthcare
  question: How many claims with allowed amount above 5000?
  sql: SELECT COUNT(*) FROM healthcare_fact_claims WHERE allowed_amount > 5000
  expect: 607
  expect_rows: 1

- id: active_employees_in_department
  domain: hr
  question: How many active employees in Data & Analytics?
  sql: >
    SELECT COUNT(*) FROM hr_fact_employees e
    JOIN hr_flight_risk_scores r ON e.employee_id = r.employee_id
    WHERE e.is_active = 1 AND r.department = 'Data & Analytics'
  expect: 103
  expect_rows: 1
  why: >
    The mirror image of the store case: here the entity is `employees` and
    `active` is a modifier that MUST set the flag. Reserving the whole entity
    phrase rather than its head noun would drop `is_active = 1` and answer 137.

- id: top_customers_by_revenue
  domain: retail
  question: Top 5 customers by revenue
  sql: >
    SELECT customer_name, SUM(revenue) AS r FROM retail_fact_sales
    GROUP BY 1 ORDER BY r DESC LIMIT 5
  expect: Canyon Charcuterie 064
  expect_rows: 5
  why: >
    Briefly became MAX(revenue) per customer -- the largest single sale,
    $3,658, in place of the largest customer, $182,503 -- when MIN/MAX were
    wired to the superlative. With an axis present the direction is the ORDER
    BY, not the aggregate.

- id: unique_channels
  domain: marketing
  question: How many unique channels?
  sql: SELECT COUNT(DISTINCT channel_id) FROM marketing_dim_channel
  expect: 7
  expect_rows: 1

- id: headcount_by_gender
  domain: hr
  question: give me headcount by gender
  sql: SELECT gender, COUNT(*) FROM hr_fact_employees GROUP BY 1 ORDER BY 1
  expect: Female
  expect_rows: 3
  why: >
    Refused for a while, as collateral from the rule that turns "list the
    departments" into a refusal: the sentence opens like a listing request.
    A named axis makes it an aggregate however politely it starts.

# --- more questions that must end in a refusal ------------------------------

- id: median_salary
  domain: hr
  question: what's the median salary?
  sql: ""
  expect: null
  expect_refusal: true
  why: >
    Answered 940,000 -- the SUM of a benchmark table's `market_median` column,
    which is not a median of anything. A named statistic this grammar cannot
    write is a refusal; silently computing a different one is worse than saying
    no, because the word the user typed is right there in the question.

- id: list_departments
  domain: wholesale
  question: list the departments
  sql: ""
  expect: null
  expect_refusal: true
  why: >
    Answered 341, the SUM of `departments_supplied`, and later 56, a COUNT over
    a three-table join. Neither is a shorter version of the list. This planner
    writes aggregates and does not do rows, and saying so names the gap.

- id: open_ended_business_question
  domain: hr
  question: What should we do about attrition?
  sql: ""
  expect: null
  expect_refusal: true
  why: >
    Not a query. The compiler has no opinion, and neither has the model on this
    repo's terms -- but the compiler is the one that has to refuse rather than
    find a column called attrition and aggregate it.

# ---------------------------------------------------------------------------
# Round three. Found by probing question SHAPES rather than wordings —
# negation, follow-ups, ratios, multi-measure asks. The negation entries are
# the most important rows in this file: before them the compiler answered the
# exact COMPLEMENT of the question, in numbers that looked entirely plausible.
# ---------------------------------------------------------------------------

- id: claims_not_denied
  domain: healthcare
  question: how many claims are not denied?
  sql: SELECT COUNT(*) FROM healthcare_fact_claims WHERE status <> 'Denied'
  expect: 11124
  expect_rows: 1
  why: >
    Answered 876 — the DENIED count — because the grammar had no notion of
    negation at all and simply bound status = 'Denied'. Negation now inverts
    exactly one unambiguous filter and refuses anything it cannot scope.

- id: employees_not_active
  domain: hr
  question: how many employees are not active?
  sql: SELECT COUNT(*) FROM hr_fact_employees WHERE is_active <> 1
  expect: 417
  expect_rows: 1
  why: >
    The same bug on a flag: answered 1,483, the ACTIVE count, where the truth
    is 417.

- id: bare_follow_up
  domain: marketing
  question: and by region?
  sql: ""
  expect: null
  expect_refusal: true
  why: >
    This compiler is stateless, so a follow-up has no previous turn to attach
    to. It used to be answered from marketing_dim_user — a table nobody had
    mentioned — because `region` happened to match there.

- id: ratio_of_two_measures
  domain: healthcare
  question: what is the ratio of paid amount to allowed amount?
  sql: ""
  expect: null
  expect_refusal: true
  why: >
    `ratio` read as a share word, so this became "what share of rows have
    status = 'Paid'" and answered 81.2% — a real number about a different
    question. A quotient of two measures is outside this grammar.

- id: two_measures_asked
  domain: wholesale
  question: total revenue and total margin by department
  sql: ""
  expect: null
  expect_refusal: true
  why: >
    Answered with revenue alone and said nothing about margin. A partial
    answer presented as a whole one is the quiet version of being wrong, and
    the grammar emits exactly one aggregate.
