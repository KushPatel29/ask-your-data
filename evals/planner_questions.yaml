# The keyless planner's accuracy contract.
#
# `evals/golden_questions.yaml` grades the MODEL. Its questions deliberately
# carry business definitions the schema does not contain ("net collection rate",
# "cost-optimal threshold", "incremental lift"), because resolving those is what
# you are paying a language model for. Scoring `engine/planner.py` against that
# file alone measures how badly a compiler does at a job it was never given.
#
# This file grades the PLANNER, on the job it actually claims: ordinary ad-hoc
# questions of a kind nobody pre-registered, phrased the way someone would type
# them into a chat box. The reference SQL was written first, by hand, from the
# schema -- NOT lifted from what the planner produced. Two of these were written
# knowing the planner refuses them, and they are kept for exactly that reason:
# an eval set trimmed to what already passes measures nothing.
#
# `expect` is the reference SQL's own first-row-first-column value, computed
# against the vendored data and frozen here, so CI catches data drift and
# planner drift as separate failures. `expect_rows` pins how many rows the
# reference returns, so a breakdown that silently collapses to one row fails.
#
# scripts/run_planner_eval.py runs both sides and reports match / differs /
# refused. tests/test_planner_contract.py is what makes it a contract.

- id: denied_claims
  domain: healthcare
  question: How many denied claims are there?
  sql: SELECT COUNT(*) FROM healthcare_fact_claims WHERE status = 'Denied'
  expect: 876
  expect_rows: 1

