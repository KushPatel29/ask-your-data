- id: revenue_by_department
  domain: wholesale
  question: What is the total revenue by department?
  sql: >
    SELECT department, SUM(revenue) FROM wholesale_fact_department_month
    GROUP BY 1 ORDER BY 1
  expect: Apparel
  expect_rows: 10

- id: stores_by_format
  domain: wholesale
  question: How many stores by store format?
  sql: >
    SELECT store_format, COUNT(*) FROM wholesale_dim_store
    GROUP BY 1 ORDER BY 1
  expect: Club Warehouse
  expect_rows: 7
  why: >
    The reference SQL here was WRONG when this file was written: it counted
    wholesale_fact_segment_month, which is one row per format per month, so
    "how many stores" came back as 34 store-months per format. The planner
    found wholesale_dim_store -- one row per store -- and disagreed with the
    contract, which is how the mistake surfaced. Kept as a reminder that an
    eval is only as good as the SQL somebody typed into it.

- id: billed_amount_total
  domain: healthcare
  question: What is the total billed amount?
  sql: SELECT SUM(billed_amount) FROM healthcare_ar_yield_predictions
  expect: 3626202.44
  expect_rows: 1
  why: >
    Kept because of how it failed. billed_amount lives in exactly one of the 71
    tables and the question names it exactly, but candidate tables used to be
    ordered by which SOURCE found them rather than by strength of evidence, and
    the only table that could answer this ranked eleventh -- one past the cut.
    The question was refused as unanswerable while its answer sat in a column of
    the same name.

- id: models_by_resource_type
  domain: dbt
  question: How many models by resource type?
  sql: SELECT resource_type, COUNT(*) FROM dbt_models GROUP BY 1 ORDER BY 1
  expect: analysis
  expect_rows: 7
  why: >
    The entity noun "models" is also a VALUE of resource_type, so the planner
    filtered to resource_type = 'model', found its axis already pinned, and
    refused for having no axis. A named axis now outranks a value match on the
    same column.

- id: top_departments_by_headcount
