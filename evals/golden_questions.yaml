- id: direct_last_touch_overcredit
  domain: marketing
  question: "How many times over does last-touch attribution overcredit the direct channel compared with its true incremental share?"
  sql: >
    SELECT ROUND(last_touch / true_incremental_share, 1) FROM marketing_attribution_comparison WHERE channel = 'direct'
  expect: 13.1

- id: most_accurate_attribution_model
  domain: marketing
  question: "Which attribution model comes closest to the true incremental channel shares?"
  sql: >
    WITH shares AS (
      SELECT channel, true_incremental_share, model, share
      FROM marketing_attribution_comparison
      UNPIVOT (share FOR model IN (first_touch, last_touch, linear, position_based, markov, shapley))
    )
    SELECT model FROM shares
    GROUP BY model ORDER BY AVG(ABS(share - true_incremental_share)) LIMIT 1
  expect: "position_based"

- id: geo_holdout_did_lift
  domain: marketing
  question: "In the geo holdout experiment, what was the difference-in-differences lift of the suppressed channel, in percent?"
  sql: >
    WITH arm AS (
      SELECT in_holdout, period, SUM(conversions) * 1.0 / SUM(sessions) AS cvr
      FROM marketing_experiment_geo_weekly GROUP BY 1, 2
    )
    SELECT ROUND(100.0 * (1
      - (SELECT cvr FROM arm WHERE in_holdout = 1 AND period = 'treatment')
      / (SELECT cvr FROM arm WHERE in_holdout = 1 AND period = 'pre')
      * (SELECT cvr FROM arm WHERE in_holdout = 0 AND period = 'pre')
      / (SELECT cvr FROM arm WHERE in_holdout = 0 AND period = 'treatment')), 2)
  expect: 4.32

- id: worst_cpa_paid_channel
  domain: marketing
  question: "Which paid channel has the worst cost per last-touch conversion?"
  sql: >
    WITH conv AS (
      SELECT last_touch_channel AS channel, COUNT(*) AS conversions
      FROM marketing_dim_user WHERE converted = 1 GROUP BY 1
    ), spend AS (
      SELECT channel, SUM(spend) AS spend FROM marketing_fact_spend GROUP BY 1
    )
    SELECT c.channel FROM marketing_dim_channel c
    JOIN spend s ON s.channel = c.channel
    JOIN conv v ON v.channel = c.channel
    WHERE c.is_paid = 1 ORDER BY s.spend / v.conversions DESC LIMIT 1
  expect: "paid_social"

- id: weakest_closing_channel
  domain: marketing
  question: "Which channel closes the smallest share of the journeys it appears in?"
  sql: >
    SELECT channel FROM marketing_fact_sessions
    GROUP BY channel
    ORDER BY SUM(CASE WHEN touch_position = touches_in_journey THEN 1 ELSE 0 END) * 1.0 / COUNT(*)
    LIMIT 1
  expect: "display"

- id: injected_defect_detection_rate
  domain: clinical
  question: "What share of the deliberately injected data defects did the validation pipeline actually detect?"
  sql: >
    SELECT ROUND(100.0 * COUNT(q.query_id) / COUNT(*), 1) FROM clinical_injected_defects d LEFT JOIN clinical_query_log q ON d.subject_id = q.subject_id AND d.visit_id = q.visit_id AND COALESCE(d.form_id, '') = COALESCE(q.form_id, '') AND COALESCE(d.record_num, -1) = COALESCE(q.record_num, -1) AND COALESCE(d.item_oid, '') = COALESCE(q.item_oid, '') AND d.expected_check = q.check_id
  expect: 100.0

- id: site_query_rate_per_subject
  domain: clinical
  question: "Which site generates the most data queries per enrolled subject?"
  sql: >
    SELECT s.site_id FROM clinical_subjects s LEFT JOIN clinical_query_log q ON q.subject_id = s.subject_id GROUP BY s.site_id ORDER BY COUNT(q.query_id) * 1.0 / COUNT(DISTINCT s.subject_id) DESC LIMIT 1
  expect: "SITE-104"

- id: stale_open_query_share
  domain: clinical
  question: "What percentage of the still-open data queries have been outstanding for 60 days or more?"
  sql: >
    SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE age_days >= 60) / COUNT(*), 1) FROM clinical_query_log WHERE status = 'open'
  expect: 31.3

- id: uncoded_meddra_share
  domain: clinical
  question: "What share of MedDRA adverse-event terms failed to code cleanly (uncoded or ambiguous)?"
  sql: >
    SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE status IN ('uncoded', 'ambiguous')) / COUNT(*), 1) FROM clinical_coding_results WHERE dictionary = 'MedDRA'
  expect: 11.6

- id: arm_completion_gap
  domain: clinical
  question: "How many percentage points separate the two treatment arms on study completion rate?"
  sql: >
    SELECT ROUND(MAX(rate) - MIN(rate), 1) FROM (SELECT arm, 100.0 * SUM(completed) / COUNT(*) AS rate FROM clinical_subjects GROUP BY arm)
  expect: 8.0

- id: aml_alert_precision
  domain: aml
  question: "Of the transactions the monitoring system alerts on at its chosen risk threshold, what percentage are actually suspicious?"
  sql: >
    SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE is_suspicious = 1) / COUNT(*), 1) FROM aml_fact_transactions WHERE risk_score >= 39.6
  expect: 25.2

- id: aml_riskiest_channel
  domain: aml
  question: "Which payment channel has the highest alert rate?"
  sql: >
    SELECT channel FROM aml_fact_transactions GROUP BY 1 ORDER BY COUNT(*) FILTER (WHERE risk_score >= 39.6) * 1.0 / COUNT(*) DESC LIMIT 1
  expect: "wire"

- id: aml_weakest_typology_recall
  domain: aml
  question: "Which laundering typology does the model catch the least often?"
  sql: >
    SELECT typology FROM aml_fact_transactions WHERE is_suspicious = 1 GROUP BY 1 ORDER BY COUNT(*) FILTER (WHERE risk_score >= 39.6) * 1.0 / COUNT(*) ASC LIMIT 1
  expect: "dormant_reactivation"

- id: aml_false_positive_cost
  domain: aml
  question: "What does one false-positive alert cost us to investigate?"
  sql: >
    SELECT DISTINCT ROUND(entity_expected_cost_cad / entity_false_positives, 2) FROM aml_threshold_sweep WHERE entity_false_negatives = 0 AND entity_false_positives > 0
  expect: 212.5

- id: aml_naive_rule_alert_multiple
  domain: aml
  question: "How many times more transactions would a flat $10,000 reporting rule alert on than the risk model does?"
  sql: >
    SELECT ROUND(COUNT(*) FILTER (WHERE amount_cad > 10000.0) * 1.0 / COUNT(*) FILTER (WHERE risk_score >= 39.6), 1) FROM aml_fact_transactions
  expect: 7.4

- id: wholesale_lowest_margin_department
  domain: wholesale
  question: "Which merchandising department earns the lowest gross margin percentage?"
  sql: >
    SELECT department FROM wholesale_fact_department_month GROUP BY department ORDER BY SUM(gross_margin) / SUM(revenue) LIMIT 1
  expect: "Electronics"

- id: wholesale_fy2025_revenue_change
  domain: wholesale
  question: "How did fiscal 2025 revenue compare with fiscal 2024 \u2014 what was the percentage change?"
  sql: >
    SELECT ROUND(100.0 * (SUM(revenue) FILTER (WHERE fiscal_year = 2025) - SUM(revenue) FILTER (WHERE fiscal_year = 2024)) / SUM(revenue) FILTER (WHERE fiscal_year = 2024), 2) FROM wholesale_finance_monthly
  expect: -4.52

- id: wholesale_top_quota_rep
  domain: wholesale
  question: "Which sales rep has the highest quota attainment over the whole period?"
  sql: >
    SELECT sales_rep_name FROM wholesale_fact_rep_month GROUP BY sales_rep_name ORDER BY SUM(revenue) / SUM(monthly_quota) DESC LIMIT 1
