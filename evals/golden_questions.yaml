- id: wholesale_cheapest_acquisition_channel
  domain: wholesale
  question: "Which marketing channel acquires new customers at the lowest cost?"
  sql: >
    SELECT channel FROM wholesale_marketing_campaigns GROUP BY channel HAVING SUM(new_customers) > 0 ORDER BY SUM(spend) / SUM(new_customers) LIMIT 1
