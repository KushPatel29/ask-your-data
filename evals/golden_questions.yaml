- id: wholesale_lowest_margin_store_format
  domain: wholesale
  question: "Which store format runs the thinnest gross margin?"
  sql: >
    SELECT store_format FROM wholesale_fact_segment_month GROUP BY store_format ORDER BY SUM(gross_margin) / SUM(revenue) LIMIT 1
  expect: "Club Warehouse"

- id: dbt_most_tested_model
  domain: dbt
  question: "Which model in the dbt warehouse carries the most data tests?"
  sql: >
    SELECT model_name FROM dbt_models WHERE resource_type = 'model' ORDER BY test_count DESC, model_name LIMIT 1
  expect: "fct_orders"

- id: dbt_referential_test_share
  domain: dbt
  question: "What share of the dbt project's data tests are referential-integrity checks?"
  sql: >
    SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE test_type = 'relationships') / COUNT(*), 1) FROM dbt_tests
  expect: 12.5

- id: dbt_undocumented_model_share
  domain: dbt
  question: "What percentage of the dbt models have no description \u2014 how bad is our documentation coverage?"
  sql: >
    SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE description IS NULL OR description = '') / COUNT(*), 1) FROM dbt_models WHERE resource_type = 'model'
  expect: 80.0

- id: dbt_exposure_upstream_marts
  domain: dbt
  question: "How many mart models does the Power BI control tower dashboard depend on?"
  sql: >
    SELECT COUNT(*) FROM dbt_lineage WHERE child = 'supply_chain_control_tower_report' AND parent_layer = 'marts'
  expect: 3

- id: dbt_revenue_month_spread
  domain: dbt
  question: "How much revenue separated the best month from the worst in the daily KPI mart?"
  sql: >
    SELECT ROUND(MAX(m.rev) - MIN(m.rev)) FROM (SELECT date_trunc('month', order_date) AS mth, SUM(revenue) AS rev FROM dbt_kpi_daily GROUP BY 1) m
  expect: 639643.0
