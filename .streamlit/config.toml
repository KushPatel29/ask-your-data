# Base chrome only. The personality lives in app/ui.py, which owns its own
# markup — Streamlit's internal data-testid selectors move between releases, and
# a theme built on them breaks silently on upgrade. These five values are the
# stable, supported surface, so they carry the ground and the rest is ours.
[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#0A0C14"
secondaryBackgroundColor = "#12151F"
textColor = "#E6E9F2"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
xsrfCookieSameSite = "lax"
# Reject arbitrary websocket Host headers while retaining the two supported
# managed platforms and local development. Ports are ignored by Streamlit.
allowedHosts = ["localhost", "127.0.0.1", "*.onrender.com", "*.streamlit.app"]
# Voice is the only upload surface and engine/voice.py enforces the same 12 MB
# ceiling after receipt. Matching it here prevents buffering larger payloads.
maxUploadSize = 12
maxMessageSize = 16

[browser]
gatherUsageStats = false
