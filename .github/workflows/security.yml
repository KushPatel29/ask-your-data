name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.lock
          require-hashes: true

  codeql:
    permissions:
      contents: read
      security-events: write
      packages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  container-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan repository for vulnerable dependencies, secrets, and misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Build the exact release image
        run: docker build -t ask-your-data:${{ github.sha }} .
      - name: Scan the release image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ask-your-data:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ask-your-data:${{ github.sha }}
          format: spdx-json
          artifact-name: ask-your-data-${{ github.sha }}.spdx.json
          upload-artifact-retention: 30
          upload-release-assets: false
