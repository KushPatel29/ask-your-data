name: CI

on:
  # Weekly, so a green badge means the tests pass now rather
  # than that they passed the day of the last push.
  schedule:
    - cron: "7 7 * * 1"
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.lock
          pip install ruff==0.16.4

      - name: Lint
        run: ruff check .

      - name: Build the warehouse and run the suite
        # No API key in CI: the SQL guard, executor, warehouse, harness (fake
        # client), the keyless compiler, and every golden reference query run
        # offline. The live model test skips automatically.
        run: pytest tests/ -v

      # The README badge is a claim about this suite, and nothing used to
      # compare the two. healthcare's badge sat at 182 while its suite had
      # grown to 345 -- the number was counting test functions, not collected
      # cases, and no check could see the difference. This fails the build if
      # the badge and the suite ever disagree again.
      - name: The README test badge must match what the suite collects
        run: |
          collected=$(python -m pytest --collect-only -q 2>/dev/null | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+')
          claimed=$(grep -oE 'badge/tests-[0-9%C,]+%20passing' README.md | head -1 | sed -E 's|badge/tests-||; s|%20passing||; s|%2C||g; s|,||g')
          echo "suite collects: ${collected:-<none>}   README badge: ${claimed:-<none>}"
          if [ -z "$collected" ] || [ -z "$claimed" ]; then
            echo "::error::could not read one of the two numbers"; exit 1
          fi
          if [ "$collected" != "$claimed" ]; then
            echo "::error::README badge says $claimed, suite collects $collected"; exit 1
          fi
      - name: Score the keyless compiler on both contracts
        # tests/test_planner_contract.py already fails the build on a
        # regression. This runs the scorecard as well, so the numbers the README
        # quotes are printed in every CI log rather than taken on trust — and so
        # the golden set's refusal count is visible when it moves.
        run: python scripts/run_planner_eval.py

      - name: Verify checkout readiness and UI contracts
        run: |
          python scripts/check_readiness.py
          python scripts/audit_ui.py

      - name: Gate RAG required-table recall
        run: |
          python scripts/run_retrieval_eval.py --min-coverage 1
          python scripts/run_retrieval_eval.py --paraphrases --min-coverage 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image and run the suite inside the container
        run: |
          docker build -t ask-your-data .
          # The image's default command serves Streamlit now, so the suite is an
          # explicit override. Same proof as before: the tests run against the
          # image's own vendored data, not against the runner's checkout.
          docker run --rm ask-your-data pytest tests/ -v
