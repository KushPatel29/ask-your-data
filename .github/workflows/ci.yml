name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.lock
          pip install ruff==0.16.4

      - name: Lint
        run: ruff check .

      - name: Build the warehouse and run the suite
        # No API key in CI: the SQL guard, executor, warehouse, harness (fake
        # client), the keyless compiler, and every golden reference query run
        # offline. The live model test skips automatically.
        run: pytest tests/ -v

      - name: Score the keyless compiler on both contracts
        # tests/test_planner_contract.py already fails the build on a
        # regression. This runs the scorecard as well, so the numbers the README
        # quotes are printed in every CI log rather than taken on trust — and so
        # the golden set's refusal count is visible when it moves.
        run: python scripts/run_planner_eval.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image and run the suite inside the container
        run: |
          docker build -t ask-your-data .
          # The image's default command serves Streamlit now, so the suite is an
          # explicit override. Same proof as before: the tests run against the
          # image's own vendored data, not against the runner's checkout.
          docker run --rm ask-your-data pytest tests/ -v
